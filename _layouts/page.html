layout: default
---
<article class="page-content">
  <p class="eyebrow">DHS · Course notebook</p>
  <h1>{{ page.title | escape }}</h1>
  {% if page.date %}<p class="muted"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>{% endif %}
  {{ content }}
</article>
